<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server error · Geodata Collector</title>
    <link rel="stylesheet" href="__BASE__/fonts/poppins.css">
    <style>
        :root { --accent:#d93925; --accent-600:#b3271a; --ink:#21262b; --muted:#646b72; --bg:#e9ebee; --surface:#fff; --border:#d9dde1; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: "Poppins", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
            color: var(--ink); background: var(--bg);
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%; max-width: 460px; text-align: center;
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: 0 10px 30px rgba(18,26,33,.12); padding: 2.4rem 2rem;
        }
        .mark { width: 52px; height: 52px; color: var(--accent); margin: 0 auto .6rem; display: block; }
        .code { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
        h1 { font-family: "Poppins", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
             font-size: 1.7rem; margin: .3rem 0 .6rem; font-weight: 700; }
        p { line-height: 1.55; color: var(--muted); margin: 0 0 1.4rem; }
        .btn {
            display: inline-block; text-decoration: none; font-weight: 600;
            padding: .65rem 1.2rem; border-radius: 6px; background: var(--accent); color: #fff;
            transition: background .12s;
        }
        .btn:hover { background: var(--accent-600); }
    </style>
</head>
<body>
    <main class="card" role="main">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div class="code">Error 500</div>
        <h1>Something went wrong</h1>
        <p>An error occurred on the server. Please try again in a moment. If the problem persists, contact the project administrator.</p>
        <a class="btn" href="__BASE__/">Back to the app</a>
    </main>
</body>
</html>
